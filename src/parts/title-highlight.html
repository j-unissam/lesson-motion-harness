<!doctype html>
<!--
  src/parts/title-highlight.html — 장면 제목 + 형광펜 강조 문장 (역할 칸: 제목 + 강조 문장)
  크기: 1920×1080 전면, 바탕 투명. 위쪽 왼편에 번호 · 제목 · 부제, 아래쪽 가운데에 형광펜 문장. 가운데(약 y 330~800)는 자료 부품 자리로 비워 둔다.
  모양: 주황 선 동그라미 번호(두 자리) + 굵은 고딕 제목 + 회색 부제 / 아래에 형광펜 띠를 깐 굵은 문장 (레퍼런스 ref7 · ref2)
  바꾸는 부분: #th-num(두 자리 번호) · #th-title(제목, 16자 안쪽) · #th-sub(부제 한 줄, 30자 안쪽, 비워도 됨)
              #th-source(장면 출처 "교과서 ○쪽", 비워도 됨 — 가운데 그림에 출처 자리가 없을 때만. 부제 줄 끝에 붙음)
              #th-lead(교과서 한 문장, 32자 안쪽) — 강조할 말 하나만 <mark class="hl"> 로 감싼다
  건드리지 않는 것: 번호 동그라미 크기 · 글자 자리 · 형광펜 색. 형광펜 띠는 한 장면에 한 군데 (정의 문장 밑줄은 따로 — docs/design.md 1장).
  따로 움직일 수 있는 조각: #th-num-ring(동그라미) · #th-title 의 .line · #th-sub 의 .line · .hl-bar(형광펜 띠, scaleX 0→1 로 칠해지게) · #th-lead 의 .line
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>title-highlight</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #th { position: absolute; inset: 0; }
  #th-head { position: absolute; left: 196px; top: 168px; display: grid; grid-template-columns: 72px auto; column-gap: 26px; row-gap: 18px; align-items: center; }
  #th-num-ring { width: 72px; height: 72px; border: 4px solid var(--color-accent); border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; color: var(--color-accent); font-size: var(--text-label); font-weight: 700; }
  #th-title { font-size: var(--text-title); font-weight: 700; line-height: 1.15; color: var(--color-ink); letter-spacing: -0.01em; }
  #th-sub { grid-column: 2; font-size: var(--text-body); font-weight: 400; color: var(--color-ink-soft); }
  #th-source { margin-left: 24px; font-size: var(--text-label); color: var(--color-ink-soft); }
  #th-lead { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-size: var(--text-lead); font-weight: 700; color: var(--color-ink); }
  #th-lead .line { display: inline-block; position: relative; padding: 0 18px; }
  .hl-bar { position: absolute; left: 0; right: 0; bottom: 2px; height: 38%; background: var(--color-highlight); z-index: -1; transform-origin: 0 50%; border-radius: 3px; }
  mark.hl { background: none; color: inherit; }
</style>
</head>
<body data-preview>
  <div id="th">
    <div id="th-head">
      <div id="th-num-ring"><span id="th-num">01</span></div>
      <h1 id="th-title"><span class="mask"><span class="line">주기율표의 역사</span></span></h1>
      <p id="th-sub"><span class="mask"><span class="line">원소들 사이의 규칙을 찾으려 하였다.<span id="th-source">예시 원고 1~2쪽</span></span></span></p>
    </div>
    <p id="th-lead"><span class="mask" style="display:inline-block"><span class="line"><span class="hl-bar"></span>저마늄의 성질은 멘델레예프가 <mark class="hl">예측한 성질</mark>과 잘 맞았다.</span></span></p>
  </div>
</body>
</html>
