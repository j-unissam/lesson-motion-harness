<!doctype html>
<!--
  src/parts/definition-note.html — 용어 정의 · 사료 · 마무리 문장 (역할 칸: 정의 · 사료 · 정리)
  크기: 1920×1080 전면, 바탕 투명. 화면 가운데에 용어 이름표 + 두세 줄 문장 + 출처.
  모양: 주황 글자 용어 이름 + 짧은 주황 밑줄 / 가운데 정렬 굵은 문장, 중요한 말 아래 노란 형광 밑줄 / 오른쪽 아래 회색 출처 (레퍼런스 ref2 위쪽 정의 문장)
  바꾸는 부분: #dn-term(용어 · "사료" · "정리" 같은 머리말, 8자 안쪽) · #dn-text(문장, 한 줄 26자 안쪽 · 세 줄까지, 교과서 원문 그대로)
              강조할 말 하나만 <mark class="ul"> 로 감싼다 · #dn-source("교과서 ○쪽")
  건드리지 않는 것: 가운데 정렬 · 줄 간격 · 형광 밑줄 두께(글자 아래 40%) · 출처 자리. 형광 밑줄은 정의 문장 안에서 한 군데 (강조 문장 띠와 따로 — docs/design.md 1장).
  따로 움직일 수 있는 조각: #dn-term · #dn-term-rule · #dn-text 의 .line(한 줄씩) · mark.ul 의 ::before 대신 .ul-bar(밑줄, scaleX 로 칠해지게) · #dn-source
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>definition-note</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #dn { position: absolute; left: 260px; right: 260px; top: 300px; text-align: center; }
  #dn-term { display: inline-block; font-size: var(--text-title); font-weight: 700; color: var(--color-accent); }
  #dn-term-rule { width: 96px; height: 6px; margin: 14px auto 0; background: var(--color-accent); border-radius: 3px; }
  #dn-text { margin-top: 48px; font-size: var(--text-lead); font-weight: 700; line-height: 1.55; color: var(--color-ink); }
  mark.ul { position: relative; background: none; color: inherit; }
  mark.ul .ul-bar { position: absolute; left: -4px; right: -4px; bottom: 0.05em; height: 0.4em; background: var(--color-highlight); z-index: -1; transform-origin: 0 50%; }
  #dn-source { position: absolute; right: 0; top: 520px; font-size: var(--text-label); color: var(--color-ink-soft); }
</style>
</head>
<body data-preview>
  <div id="dn">
    <div id="dn-term">주기율표</div>
    <div id="dn-term-rule"></div>
    <p id="dn-text">
      <span class="mask"><span class="line">주기율표는 원소를 <mark class="ul"><span class="ul-bar"></span>원자 번호</mark> 순서로 배열하되,</span></span>
      <span class="mask"><span class="line">성질이 비슷한 원소가 같은 세로줄에 오도록</span></span>
      <span class="mask"><span class="line">배열한 표이다.</span></span>
    </p>
    <p id="dn-source">예시 원고 3쪽</p>
  </div>
</body>
</html>
